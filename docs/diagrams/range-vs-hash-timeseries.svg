"><div style="display: inline-block; font-size: 12px; font-family: Helvetica; color: #000000; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">One-day read WHERE recorded_at &gt;= '11-14' AND &lt; '11-15':<br /><br />RANGE → scans 1 partition (partition pruning)<br />HASH  → fans out to all 8 shards<br /><br />Trade-off: range optimizes windowed READS,<br />concentrates WRITES on 'now'. Hash is the mirror.</div></div></div></foreignObject><text x="838" y="281" fill="#000000" font-family="Helvetica" font-size="12px" style="fill: rgb(0, 0, 0);"><tspan x="838" y="281">One-day read WHERE recorded_at &gt;= '11-14' AND &lt;</tspan><tspan x="838" y="295">'11-15':</tspan><tspan x="838" y="309"></tspan><tspan x="838" y="323">RANGE → scans 1 partition (partition pruning)</tspan><tspan x="838" y="337">HASH → fans out to all 8 shards</tspan><tspan x="838" y="351"></tspan><tspan x="838" y="365">Trade-off: range optimizes windowed READS,</tspan><tspan x="838" y="379">concentrates WRITES on 'now'. Hash is the mirror.</tspan></text></switch></g></g></g></g></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>