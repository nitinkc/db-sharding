services:
  coordinator:
    build: ./db
    image: db-sharding-pg16-citus:13.4-postgis
    command: -c shared_preload_libraries=citus
    container_name: fleet-coordinator
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./db/coordinator-init:/docker-entrypoint-initdb.d
      - coordinator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d fleet"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - fleet-net

  worker1:
    build: ./db
    image: db-sharding-pg16-citus:13.4-postgis
    command: -c shared_preload_libraries=citus
    container_name: fleet-worker1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./db/worker-init:/docker-entrypoint-initdb.d
      - worker1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d fleet"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - fleet-net

  worker2:
    build: ./db
    image: db-sharding-pg16-citus:13.4-postgis
    command: -c shared_preload_libraries=citus
    container_name: fleet-worker2
